version: '3.8'

services:
  pigweight-optimized:
    build:
      context: .
      dockerfile: Dockerfile.optimized
    container_name: pigweight-optimized
    
    # GPU поддержка
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, video]
              
    # Переменные окружения
    environment:
      # Основные настройки - CUDA 12.9 и BALANCED профиль
      - CUDA_ENABLED=true
      - CUDA_DEVICE=0
      - CUDA_VERSION=12.9
      - USE_HALF_PRECISION=true
      - ENABLE_H264_DIRECT=true
      
      # Производительность - BALANCED профиль по умолчанию
      - TARGET_FPS=60
      - BATCH_MAX_SIZE=16
      - BATCH_TARGET_LATENCY_MS=50
      - QUALITY_INITIAL_LEVEL=HIGH
      
      # Мониторинг
      - MONITOR_ENABLE_ALERTS=true
      - MONITOR_WEBSOCKET_PORT=8765
      
      # Сеть
      - WEBRTC_MAX_BITRATE=4000000
      - NETWORK_BUFFER_SIZE_KB=64
      
    # Порты
    ports:
      - "8000:8000"    # API сервер
      - "8765:8765"    # WebSocket мониторинг
      
    # Объемы
    volumes:
      - ./models:/app/models:ro
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      
    # Сетевые настройки
    sysctls:
      - net.core.rmem_max=134217728
      - net.core.wmem_max=134217728
      - net.ipv4.tcp_rmem=4096 87380 134217728
      - net.ipv4.tcp_wmem=4096 65536 134217728
      
    # Ресурсы
    shm_size: '2gb'
    ulimits:
      memlock:
        soft: -1
        hard: -1
      stack: 67108864
      
    # Restart политика
    restart: unless-stopped
    
    # Проверка здоровья
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
      
    # Зависимости (если нужны)
    depends_on:
      - redis
      - prometheus
      
  # Redis для кеширования (опционально)
  redis:
    image: redis:7-alpine
    container_name: pigweight-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    
  # Prometheus для метрик (опционально)
  prometheus:
    image: prom/prometheus:latest
    container_name: pigweight-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    restart: unless-stopped
    
  # Grafana для визуализации (опционально)
  grafana:
    image: grafana/grafana:latest
    container_name: pigweight-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    restart: unless-stopped
    depends_on:
      - prometheus

# Именованные тома
volumes:
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

# Сети
networks:
  default:
    name: pigweight-network
    driver: bridge