<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PigWeight Mobile Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            height: 100%;
            max-height: 100vh;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Liquid Glass Effect */
        .glass {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            transition: all 0.3s ease;
        }

        .glass:hover {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.5);
        }

        /* Header */
        .header {
            text-align: center;
            color: white;
            padding-bottom: 10px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 5px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        .header .status {
            font-size: 12px;
            opacity: 0.9;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            background: #4ade80;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* 🚦 Traffic Light Status */
        .traffic-light {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin: 15px 0;
        }

        .light {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .light.red {
            background: linear-gradient(135deg, #ff4757 0%, #ff6348 100%);
            box-shadow: 0 0 20px rgba(255, 71, 87, 0.6);
        }

        .light.yellow {
            background: linear-gradient(135deg, #ffa502 0%, #ffb700 100%);
            box-shadow: 0 0 20px rgba(255, 165, 2, 0.6);
            animation: blink 0.6s infinite;
        }

        .light.green {
            background: linear-gradient(135deg, #2ed573 0%, #26de81 100%);
            box-shadow: 0 0 20px rgba(46, 213, 115, 0.6);
            animation: glow 1s infinite;
        }

        .light.gray {
            background: linear-gradient(135deg, #95a5a6 0%, #7f8c8d 100%);
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.2);
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 0 20px rgba(46, 213, 115, 0.6); }
            50% { box-shadow: 0 0 30px rgba(46, 213, 115, 0.9); }
        }

        .status-text {
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            color: white;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
            margin-top: 8px;
        }

        /* Stabilization Progress Bar */
        .stabilization-bar {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            height: 8px;
            overflow: hidden;
            margin: 10px 0;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .stabilization-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff4757 0%, #ffa502 50%, #2ed573 100%);
            width: 0%;
            transition: width 0.5s ease;
            border-radius: 10px;
        }

        /* Weight Balance Indicator */
        .weight-balance {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin: 12px 0;
            font-size: 12px;
        }

        .balance-label {
            color: rgba(255, 255, 255, 0.7);
            flex: 0 0 auto;
        }

        .balance-scale {
            flex: 1;
            display: flex;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .balance-indicator {
            position: absolute;
            width: 3px;
            height: 100%;
            background: white;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
        }

        .balance-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff4757, #2ed573);
            border-radius: 3px;
        }

        .balance-value {
            color: rgba(255, 255, 255, 0.8);
            flex: 0 0 auto;
            font-weight: 600;
            min-width: 40px;
            text-align: right;
        }

        /* Recommendation Box */
        .recommendation {
            background: rgba(255, 255, 255, 0.1);
            border-left: 4px solid #2ed573;
            padding: 12px 15px;
            border-radius: 10px;
            font-size: 13px;
            color: white;
            font-weight: 500;
            text-align: center;
            transition: all 0.3s ease;
        }

        .recommendation.waiting {
            border-left-color: #ffa502;
            background: rgba(255, 165, 2, 0.1);
        }

        .recommendation.unstable {
            border-left-color: #ff4757;
            background: rgba(255, 71, 87, 0.1);
        }

        .recommendation.ready {
            border-left-color: #2ed573;
            background: rgba(46, 213, 115, 0.1);
        }

        /* Metrics Grid */
        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            flex: 1;
            overflow-y: auto;
        }

        .metric-card {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 8px;
            color: white;
            min-height: 100px;
        }

        .metric-icon {
            font-size: 32px;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.2));
        }

        .metric-value {
            font-size: 36px;
            font-weight: 700;
            line-height: 1;
        }

        .metric-label {
            font-size: 12px;
            opacity: 0.85;
            text-align: center;
        }

        /* Full Width Cards */
        .metric-full {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
        }

        .metric-full-item {
            flex: 1;
            text-align: center;
            color: white;
        }

        .metric-full-item .value {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .metric-full-item .label {
            font-size: 11px;
            opacity: 0.85;
        }

        .metric-full-item .divider {
            width: 1px;
            height: 50px;
            background: rgba(255, 255, 255, 0.2);
            margin: 0 20px;
            flex-shrink: 0;
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            min-width: 100px;
            padding: 14px 20px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-auto {
            background: rgba(255, 255, 255, 0.25);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.4);
        }

        .btn-auto:active {
            background: rgba(255, 255, 255, 0.35);
            border: 2px solid rgba(255, 255, 255, 0.6);
        }

        .btn-auto.active {
            background: rgba(74, 222, 128, 0.3);
            border: 2px solid rgba(74, 222, 128, 0.6);
            color: #4ade80;
        }

        .btn-fix {
            background: rgba(248, 113, 113, 0.3);
            color: #f87171;
            border: 2px solid rgba(248, 113, 113, 0.5);
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-fix.active {
            background: rgba(248, 113, 113, 0.4);
            border: 2px solid rgba(248, 113, 113, 0.7);
            opacity: 1;
            cursor: pointer;
        }

        .btn-fix:active {
            background: rgba(248, 113, 113, 0.5);
            transform: scale(0.98);
        }

        .btn-action {
            background: rgba(59, 130, 246, 0.3);
            color: #60a5fa;
            border: 2px solid rgba(59, 130, 246, 0.5);
        }

        .btn-action:active {
            background: rgba(59, 130, 246, 0.4);
            border: 2px solid rgba(59, 130, 246, 0.7);
            transform: scale(0.98);
        }

        /* Toggle Switch */
        .toggle-switch {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            font-size: 13px;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(255, 255, 255, 0.3);
            transition: 0.3s;
            border-radius: 24px;
            border: 2px solid rgba(255, 255, 255, 0.5);
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 2px;
            bottom: 2px;
            background-color: white;
            transition: 0.3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: rgba(74, 222, 128, 0.5);
            border: 2px solid rgba(74, 222, 128, 0.8);
        }

        input:checked + .slider:before {
            transform: translateX(20px);
        }

        /* Footer Info */
        .footer-info {
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            font-size: 11px;
            padding: 8px 0;
        }

        /* Loading State */
        .loading {
            text-align: center;
            color: white;
            padding: 40px 20px;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 3px solid white;
            animation: spin 1s linear infinite;
            margin-bottom: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-height: 600px) {
            .metric-card {
                min-height: 80px;
            }

            .metric-value {
                font-size: 28px;
            }
        }

        @media (max-height: 500px) {
            .metrics-grid {
                gap: 8px;
            }

            .glass {
                padding: 16px;
            }

            .metric-card {
                min-height: 70px;
                gap: 4px;
            }

            .metric-icon {
                font-size: 24px;
            }

            .metric-value {
                font-size: 24px;
            }

            .metric-label {
                font-size: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header glass">
            <h1>🐷 PigWeight</h1>
            <div class="status">
                <div class="status-indicator"></div>
                <span id="status-text">Подключение...</span>
            </div>
        </div>

        <!-- 🚦 Traffic Light Status (Stabilization) -->
        <div class="glass">
            <div class="traffic-light">
                <div id="light-red" class="light gray" title="Нестабильно"></div>
                <div id="light-yellow" class="light gray" title="Стабилизация"></div>
                <div id="light-green" class="light gray" title="Готово"></div>
            </div>
            <div class="status-text" id="stability-status">⏳ Инициализация...</div>
            
            <!-- Stabilization Progress -->
            <div class="stabilization-bar">
                <div class="stabilization-fill" id="stabilization-fill" style="width: 0%;"></div>
            </div>
            
            <!-- Weight Balance -->
            <div class="weight-balance">
                <span class="balance-label">⚖️ Баланс</span>
                <div class="balance-scale">
                    <div class="balance-fill" id="balance-fill"></div>
                    <div class="balance-indicator"></div>
                </div>
                <span class="balance-value" id="balance-value">0%</span>
            </div>
            
            <!-- Recommendation -->
            <div class="recommendation ready" id="recommendation">
                ✅ Система готова
            </div>
        </div>

        <!-- Metrics Grid -->
        <div class="glass" style="flex: 1; overflow-y: auto; padding: 16px;">
            <div class="metrics-grid">
                <!-- Текущее количество -->
                <div class="metric-card">
                    <div class="metric-icon">🐷</div>
                    <div class="metric-value" id="current-count">0</div>
                    <div class="metric-label">Текущих свиней</div>
                </div>

                <!-- Средний вес -->
                <div class="metric-card">
                    <div class="metric-icon">⚖️</div>
                    <div class="metric-value" id="avg-weight">0.0</div>
                    <div class="metric-label">Средний вес</div>
                </div>

                <!-- Полная информация -->
                <div class="glass metric-full" style="background: rgba(255, 255, 255, 0.08);">
                    <div class="metric-full-item">
                        <div class="value" id="total-weight">0.0</div>
                        <div class="label">Общий вес (кг)</div>
                    </div>
                    <div class="metric-full-item" style="padding: 0 10px;">
                        <div class="divider"></div>
                    </div>
                    <div class="metric-full-item">
                        <div class="value" id="total-count">0</div>
                        <div class="label">Всего проходов</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Auto/Manual Toggle -->
        <div class="glass toggle-switch">
            <span>📍 Режим фиксации:</span>
            <label class="switch">
                <input type="checkbox" id="auto-toggle" checked>
                <span class="slider"></span>
            </label>
            <span id="mode-text" style="font-weight: 600;">АВТО</span>
        </div>

        <!-- Controls -->
        <div class="glass">
            <div class="controls">
                <button class="btn btn-auto active" id="auto-btn">
                    <span>🔄</span>
                    <span>АВТО</span>
                </button>
                <button class="btn btn-fix" id="fix-btn">
                    <span>📌</span>
                    <span>ФИКСИРОВАТЬ</span>
                </button>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="glass">
            <div class="controls">
                <button class="btn btn-action" id="export-btn" title="Экспортировать результаты в Excel">
                    <span>📥</span>
                    <span>ЭКСПОРТ</span>
                </button>
                <button class="btn btn-action" id="compare-btn" title="Сверить с ручными записями">
                    <span>⚖️</span>
                    <span>СВЕРКА</span>
                </button>
            </div>
        </div>

        <!-- Footer Info -->
        <div class="footer-info">
            <span id="update-time">Обновление: --:--:--</span>
        </div>
    </div>

    <script>
        // Используем относительный путь для работы на любом хосте/порту
        const API_URL = `${window.location.origin}/api`;
        let autoMode = true;
        let activeAct = false;

        // Elements
        const statusText = document.getElementById('status-text');
        const currentCount = document.getElementById('current-count');
        const avgWeight = document.getElementById('avg-weight');
        const totalWeight = document.getElementById('total-weight');
        const totalCount = document.getElementById('total-count');
        const autoToggle = document.getElementById('auto-toggle');
        const modeText = document.getElementById('mode-text');
        const autoBtn = document.getElementById('auto-btn');
        const fixBtn = document.getElementById('fix-btn');
        const exportBtn = document.getElementById('export-btn');
        const compareBtn = document.getElementById('compare-btn');
        const updateTime = document.getElementById('update-time');
        
        // Traffic Light Elements
        const lightRed = document.getElementById('light-red');
        const lightYellow = document.getElementById('light-yellow');
        const lightGreen = document.getElementById('light-green');
        const stabilityStatus = document.getElementById('stability-status');
        const stabilizationFill = document.getElementById('stabilization-fill');
        const balanceFill = document.getElementById('balance-fill');
        const balanceValue = document.getElementById('balance-value');
        const recommendation = document.getElementById('recommendation');
        
        // Stabilization tracking
        let weightHistory = [];
        let countHistory = [];
        const HISTORY_SIZE = 30; // последних 30 измерений
        const STABILITY_THRESHOLD = 5; // % отклонения для стабилизации

        // Initialize
        console.log('🚀 PigWeight Mobile Dashboard инициализирован');

        // Event Listeners
        autoToggle.addEventListener('change', (e) => {
            autoMode = e.target.checked;
            modeText.textContent = autoMode ? 'АВТО' : 'РУЧНОЙ';
            autoBtn.classList.toggle('active', autoMode);
            fixBtn.classList.toggle('active', !autoMode && activeAct);
            toggleAutoMode();
        });

        autoBtn.addEventListener('click', () => {
            if (!autoMode) {
                autoToggle.checked = true;
                autoMode = true;
                modeText.textContent = 'АВТО';
                autoBtn.classList.add('active');
                fixBtn.classList.remove('active');
                toggleAutoMode();
            }
        });

        fixBtn.addEventListener('click', () => {
            if (!autoMode && activeAct) {
                fixCurrentAct();
            }
        });

        exportBtn.addEventListener('click', () => {
            exportToExcel();
        });

        compareBtn.addEventListener('click', () => {
            showCompareDialog();
        });

        // Состояние подключения
        let isOnline = true;
        let retryCount = 0;
        const MAX_RETRIES = 3;
        const RETRY_DELAY = 2000; // 2 секунды

        // Fetch metrics с обработкой ошибок и retry
        async function fetchMetrics() {
            try {
                // Используем новый endpoint по спецификации
                const response = await fetch(`${API_URL}/stats/current`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    signal: AbortSignal.timeout(5000) // 5 секунд таймаут
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();

                if (data.current_count !== undefined) {
                    currentCount.textContent = data.current_count;
                    totalCount.textContent = (data.left_count || 0) + (data.right_count || 0);
                    avgWeight.textContent = (data.avg_weight || 0).toFixed(1);
                    totalWeight.textContent = (data.total_weight || 0).toFixed(1);

                    // Check if active act
                    activeAct = !!data.active_act;
                    fixBtn.classList.toggle('active', !autoMode && activeAct);

                    statusText.textContent = data.stream_id || 'Готово';
                    
                    // 🚦 Update stabilization status
                    updateStabilizationStatus(data.current_count || 0, data.avg_weight || 0);
                    
                    // Сбрасываем счетчик ошибок при успешном запросе
                    retryCount = 0;
                    isOnline = true;
                    updateConnectionStatus(true);
                } else {
                    statusText.textContent = 'Нет данных';
                }

                updateTime.textContent = new Date().toLocaleTimeString('ru-RU');
            } catch (error) {
                console.error('❌ Ошибка загрузки метрик:', error);
                isOnline = false;
                updateConnectionStatus(false);
                
                // Retry с exponential backoff
                if (retryCount < MAX_RETRIES) {
                    retryCount++;
                    const delay = RETRY_DELAY * Math.pow(2, retryCount - 1); // Exponential backoff
                    console.log(`🔄 Повторная попытка через ${delay}ms (попытка ${retryCount}/${MAX_RETRIES})`);
                    setTimeout(fetchMetrics, delay);
                } else {
                    statusText.textContent = 'Ошибка подключения';
                    console.error('❌ Превышено максимальное количество попыток');
                }
            }
        }

        // Обновление статуса подключения
        function updateConnectionStatus(online) {
            const statusIndicator = document.querySelector('.status-indicator');
            if (statusIndicator) {
                if (online) {
                    statusIndicator.style.background = '#4ade80';
                    statusIndicator.style.animation = 'pulse 2s infinite';
                } else {
                    statusIndicator.style.background = '#ef4444';
                    statusIndicator.style.animation = 'none';
                }
            }
        }

        // Toggle auto mode с обработкой ошибок
        async function toggleAutoMode() {
            try {
                const response = await fetch(`${API_URL}/metrics/toggle-auto-fix?enabled=${autoMode}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    signal: AbortSignal.timeout(5000)
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                console.log('✅ Режим изменён:', data.auto_manual);
            } catch (error) {
                console.error('❌ Ошибка смены режима:', error);
                // Показываем пользователю ошибку
                statusText.textContent = 'Ошибка изменения режима';
                setTimeout(() => {
                    if (isOnline) {
                        statusText.textContent = 'Готово';
                    }
                }, 3000);
            }
        }

        // 🚦 Update Traffic Light Status
        function updateStabilizationStatus(count, weight) {
            // Добавляем в историю
            countHistory.push(count);
            weightHistory.push(weight);
            
            // Ограничиваем размер истории
            if (countHistory.length > HISTORY_SIZE) countHistory.shift();
            if (weightHistory.length > HISTORY_SIZE) weightHistory.shift();
            
            // Если недостаточно данных
            if (countHistory.length < 5) {
                setTrafficLight('gray', '⏳ Инициализация...', 20);
                recommendation.className = 'recommendation waiting';
                recommendation.innerHTML = '⏳ Собираем данные...';
                return;
            }
            
            // Анализируем стабильность
            const countVariation = calculateVariation(countHistory);
            const weightVariation = calculateVariation(weightHistory);
            
            // Вычисляем стабилизацию (0-100%)
            const stabilization = Math.max(0, 100 - (countVariation + weightVariation) / 2);
            stabilizationFill.style.width = stabilization + '%';
            
            // Вычисляем баланс веса (отклонение от среднего)
            const avgW = weightHistory[weightHistory.length - 1];
            const avgHistorical = weightHistory.reduce((a, b) => a + b, 0) / weightHistory.length;
            const balancePercent = Math.abs(avgW - avgHistorical) / avgHistorical * 100;
            const balanceFillPercent = Math.max(0, 100 - balancePercent * 2);
            balanceFill.style.width = balanceFillPercent + '%';
            balanceValue.textContent = balancePercent.toFixed(1) + '%';
            
            // Определяем статус светофора
            if (stabilization >= 80 && countVariation < STABILITY_THRESHOLD && weightVariation < STABILITY_THRESHOLD) {
                // 🟢 GREEN - Готово к взвешиванию
                setTrafficLight('green', '✅ ГОТОВО К ВЗВЕШИВАНИЮ', stabilization);
                recommendation.className = 'recommendation ready';
                recommendation.innerHTML = '✅ Свиньи стабилизированы - можно фиксировать акт!';
            } else if (stabilization >= 40) {
                // 🟡 YELLOW - Стабилизация в процессе
                setTrafficLight('yellow', '⏳ СТАБИЛИЗАЦИЯ...', stabilization);
                recommendation.className = 'recommendation waiting';
                recommendation.innerHTML = '⏳ Ждите стабилизации...';
            } else {
                // 🔴 RED - Нестабильно, помощь нужна
                setTrafficLight('red', '❌ НЕСТАБИЛЬНО', stabilization);
                recommendation.className = 'recommendation unstable';
                recommendation.innerHTML = '❌ Слишком много движений - подождите или помогите стабилизировать';
            }
        }
        
        function calculateVariation(values) {
            if (values.length === 0) return 0;
            const avg = values.reduce((a, b) => a + b, 0) / values.length;
            const variance = values.reduce((sum, val) => sum + Math.pow((val - avg), 2), 0) / values.length;
            const stdDev = Math.sqrt(variance);
            return (stdDev / avg) * 100; // % variation
        }
        
        function setTrafficLight(color, status, percent) {
            // Reset all lights
            lightRed.className = 'light gray';
            lightYellow.className = 'light gray';
            lightGreen.className = 'light gray';
            
            // Set active light
            if (color === 'red') {
                lightRed.className = 'light red';
            } else if (color === 'yellow') {
                lightYellow.className = 'light yellow';
            } else if (color === 'green') {
                lightGreen.className = 'light green';
            }
            
            stabilityStatus.textContent = status + ` (${Math.round(percent)}%)`;
        }

        // Fix current act с обработкой ошибок
        async function fixCurrentAct() {
            try {
                fixBtn.disabled = true;
                fixBtn.textContent = '⏳ ФИКСИРУЕТСЯ...';
                
                const response = await fetch(`${API_URL}/metrics/manual-fix`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    signal: AbortSignal.timeout(10000)
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                console.log('✅ Акт зафиксирован:', data.act_fixed);
                activeAct = false;
                fixBtn.classList.remove('active');
                
                // Refresh metrics
                await fetchMetrics();
            } catch (error) {
                console.error('❌ Ошибка фиксации акта:', error);
                statusText.textContent = 'Ошибка фиксации акта';
                setTimeout(() => {
                    if (isOnline) {
                        statusText.textContent = 'Готово';
                    }
                }, 3000);
            } finally {
                fixBtn.disabled = false;
                fixBtn.textContent = '📌 ФИКСИРОВАТЬ';
            }
        }

        // Export to Excel с улучшенной обработкой ошибок
        async function exportToExcel() {
            try {
                exportBtn.disabled = true;
                exportBtn.innerHTML = '<span>⏳</span><span>ЭКСПОРТ...</span>';
                
                // Получаем даты для экспорта (последние 7 дней)
                const endDate = new Date();
                const startDate = new Date();
                startDate.setDate(startDate.getDate() - 7);
                
                // Вызываем API экспорта с таймаутом
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 60000); // 60 секунд таймаут
                
                try {
                    const response = await fetch(`${API_URL}/export/excel`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            start_date: startDate.toISOString(),
                            end_date: endDate.toISOString()
                        }),
                        signal: controller.signal
                    });
                    
                    clearTimeout(timeoutId);
                    
                    if (response.ok) {
                        // Скачиваем файл
                        const blob = await response.blob();
                        const url = window.URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = `acts_${startDate.toISOString().split('T')[0]}_${endDate.toISOString().split('T')[0]}.xlsx`;
                        document.body.appendChild(a);
                        a.click();
                        window.URL.revokeObjectURL(url);
                        document.body.removeChild(a);
                        
                        // Показываем уведомление
                        statusText.textContent = '✅ Экспорт завершён';
                        setTimeout(() => {
                            if (isOnline) {
                                statusText.textContent = 'Готово';
                            }
                        }, 3000);
                    } else {
                        const error = await response.json().catch(() => ({ error: 'Неизвестная ошибка' }));
                        throw new Error(error.detail || error.error || 'Ошибка экспорта');
                    }
                } catch (fetchError) {
                    clearTimeout(timeoutId);
                    if (fetchError.name === 'AbortError') {
                        throw new Error('Таймаут экспорта (60 секунд)');
                    }
                    throw fetchError;
                }
            } catch (error) {
                console.error('❌ Ошибка экспорта:', error);
                statusText.textContent = '❌ Ошибка экспорта';
                setTimeout(() => {
                    if (isOnline) {
                        statusText.textContent = 'Готово';
                    }
                }, 3000);
            } finally {
                exportBtn.disabled = false;
                exportBtn.innerHTML = '<span>📥</span><span>ЭКСПОРТ</span>';
            }
        }

        // Compare with manual records
        function showCompareDialog() {
            try {
                compareBtn.disabled = true;
                compareBtn.textContent = '⏳ СВЕРКА...';
                
                // Создаём input для загрузки файла
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = '.xlsx,.xls';
                
                input.onchange = async (e) => {
                    const file = e.target.files[0];
                    if (!file) {
                        compareBtn.disabled = false;
                        compareBtn.textContent = '⚖️ СВЕРКА';
                        return;
                    }
                    
                    try {
                        // Загружаем файл на сервер
                        const formData = new FormData();
                        formData.append('file', file);
                        
                        const response = await fetch(`${API_URL}/compare/excel`, {
                            method: 'POST',
                            body: formData
                        });
                        
                        if (response.ok) {
                            const result = await response.json();
                            
                            // Показываем результаты
                            alert(`✅ Сверка завершена!\n\n` +
                                  `📊 Совпадений: ${result.matches || 0}\n` +
                                  `⚠️ Расхождений: ${result.discrepancies || 0}\n` +
                                  `📈 Точность: ${(result.accuracy * 100).toFixed(1)}%\n\n` +
                                  `Метрики:\n` +
                                  `• Recall: ${(result.metrics.recall * 100).toFixed(1)}%\n` +
                                  `• Precision: ${(result.metrics.precision * 100).toFixed(1)}%\n` +
                                  `• F1-score: ${(result.metrics.f1_score * 100).toFixed(1)}%\n\n` +
                                  `Отчёт сохранён: ${result.report_url}`);
                            
                            // Скачиваем отчёт
                            if (result.report_url) {
                                window.open(result.report_url, '_blank');
                            }
                        } else {
                            const error = await response.json();
                            alert(`❌ Ошибка сверки:\n${error.detail || error.error || 'Неизвестная ошибка'}`);
                        }
                    } catch (error) {
                        console.error('❌ Ошибка сверки:', error);
                        alert('❌ Ошибка при сверке:\n' + error.message);
                    }
                    
                    compareBtn.disabled = false;
                    compareBtn.textContent = '⚖️ СВЕРКА';
                };
                
                input.click();
                
                // Если пользователь отменил выбор файла
                setTimeout(() => {
                    if (compareBtn.disabled) {
                        compareBtn.disabled = false;
                        compareBtn.textContent = '⚖️ СВЕРКА';
                    }
                }, 100);
                
            } catch (error) {
                console.error('❌ Ошибка сверки:', error);
                alert('❌ Ошибка при сверке:\n' + error.message);
                compareBtn.disabled = false;
                compareBtn.textContent = '⚖️ СВЕРКА';
            }
        }

        // Update every 1 second
        fetchMetrics();
        setInterval(fetchMetrics, 1000);

        console.log('✅ Система инициализирована и готова');
    </script>
</body>
</html>
