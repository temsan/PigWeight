<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест исправлений - PigWeight</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: white;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .test-item {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 4px solid #3b82f6;
        }
        .test-item.success { border-left-color: #10b981; }
        .test-item.error { border-left-color: #ef4444; }
        .test-item.warning { border-left-color: #f59e0b; }
        .btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            margin: 5px;
        }
        .btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        #testResults {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 Тест исправлений</h1>
        <p>Проверка исправленных проблем</p>
        
        <div>
            <button class="btn" onclick="testChartJS()">Тест Chart.js</button>
            <button class="btn" onclick="testCSP()">Тест CSP</button>
            <button class="btn" onclick="testDiagnostics()">Тест диагностики</button>
            <button class="btn" onclick="runAllTests()">Запустить все тесты</button>
        </div>
        
        <div id="testResults"></div>
        
        <div style="margin-top: 20px;">
            <a href="/" style="color: #4ade80;">← Назад к приложению</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        const results = document.getElementById('testResults');
        
        function addResult(test, status, message) {
            const div = document.createElement('div');
            div.className = `test-item ${status}`;
            div.innerHTML = `
                <strong>${test}:</strong> 
                <span style="color: ${status === 'success' ? '#10b981' : status === 'error' ? '#ef4444' : '#f59e0b'}">
                    ${status === 'success' ? '✅' : status === 'error' ? '❌' : '⚠️'}
                </span>
                ${message}
            `;
            results.appendChild(div);
        }
        
        function testChartJS() {
            if (typeof Chart !== 'undefined') {
                addResult('Chart.js', 'success', 'Chart.js загружен успешно');
                
                // Создаем тестовый график
                try {
                    const canvas = document.createElement('canvas');
                    canvas.width = 100;
                    canvas.height = 100;
                    canvas.style.display = 'none';
                    document.body.appendChild(canvas);
                    
                    const ctx = canvas.getContext('2d');
                    const testChart = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: ['1', '2', '3'],
                            datasets: [{
                                label: 'Test',
                                data: [1, 2, 3],
                                borderColor: '#2c7be5'
                            }]
                        },
                        options: {
                            responsive: false,
                            animation: false
                        }
                    });
                    
                    testChart.destroy();
                    document.body.removeChild(canvas);
                    addResult('Chart.js создание', 'success', 'График создается без ошибок');
                } catch (error) {
                    addResult('Chart.js создание', 'error', 'Ошибка создания графика: ' + error.message);
                }
            } else {
                addResult('Chart.js', 'error', 'Chart.js не загружен');
            }
        }
        
        function testCSP() {
            // Проверяем, можем ли мы загружать внешние скрипты
            const script = document.createElement('script');
            script.src = 'https://cdn.jsdelivr.net/npm/chart.js';
            script.onload = function() {
                addResult('CSP Script Loading', 'success', 'Внешние скрипты загружаются');
            };
            script.onerror = function() {
                addResult('CSP Script Loading', 'error', 'CSP блокирует внешние скрипты');
            };
            
            // Проверяем eval
            try {
                eval('1+1');
                addResult('CSP Eval', 'success', 'eval() разрешен');
            } catch (error) {
                addResult('CSP Eval', 'error', 'eval() заблокирован CSP');
            }
        }
        
        async function testDiagnostics() {
            try {
                const response = await fetch('/api/diagnostics/quick');
                const data = await response.json();
                
                if (response.ok) {
                    addResult('Диагностика API', 'success', 'API диагностики работает');
                    
                    // Проверяем результаты
                    if (data.status === 'ok') {
                        addResult('Системные проверки', 'success', 'Все основные компоненты в порядке');
                    } else {
                        addResult('Системные проверки', 'warning', 'Обнаружены проблемы в системе');
                    }
                } else {
                    addResult('Диагностика API', 'error', 'Ошибка API: ' + response.status);
                }
            } catch (error) {
                addResult('Диагностика API', 'error', 'Ошибка подключения: ' + error.message);
            }
        }
        
        async function runAllTests() {
            results.innerHTML = '<div class="test-item">Запуск тестов...</div>';
            
            testChartJS();
            testCSP();
            await testDiagnostics();
            
            addResult('Все тесты', 'success', 'Тестирование завершено');
        }
        
        // Автоматический запуск при загрузке
        window.addEventListener('load', () => {
            setTimeout(() => {
                addResult('Страница', 'success', 'Страница загружена успешно');
                testChartJS();
            }, 1000);
        });
    </script>
</body>
</html>
