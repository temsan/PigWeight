<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>PigWeight MVP</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <link rel="stylesheet" href="/static/css/theme.css">
  <style>
    .top-toolbar { position: fixed !important; top: 0; left: 0; right: 0; z-index: 1000; background: rgba(255, 255, 255, 0.56); backdrop-filter: blur(12px); box-shadow: 0 2px 12px rgba(40,60,90,0.12); overflow: visible !important; height: auto !important; max-height: none !important; }
    .top-toolbar .container { overflow: visible !important; height: auto !important; max-height: none !important; flex-wrap: wrap !important; align-items: center !important; }
    .top-toolbar .pill, .top-toolbar .file-input-btn { height: 32px; line-height: 20px; }
    html, body { margin: 0; padding: 0; }
    #main-container { padding-top: 64px; }
    .video-wrapper { position: relative; }
    #overlayCanvas { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:auto; z-index: 10; background-color: transparent; cursor: crosshair; }
    #videoStream { display: block; width: 100%; height: auto; object-fit: contain; z-index: 1; }
    /* Align numeric inputs on the weights panel to the right */
    .panel-body input[type="number"] { text-align: right; }
    .stream-status { display:inline-block; min-width:64px; text-align:right; }
    /* Loading overlay */
    #loadingOverlay { position:absolute; inset:0; z-index: 20; display:none; align-items:center; justify-content:center; backdrop-filter: blur(2px); background: rgba(245,248,255,0.72); }
    #loadingOverlay .box { display:flex; flex-direction:column; align-items:center; gap:10px; padding:16px 18px; border-radius:12px; background: rgba(255,255,255,0.9); border:1px solid rgba(60,90,140,.12); box-shadow: 0 6px 24px rgba(40,60,90,.12); }
    #loadingOverlay .spinner { width:28px; height:28px; border:3px solid rgba(44,123,229,0.18); border-top-color:#2c7be5; border-radius:50%; animation: spin 0.9s linear infinite; }
    #loadingOverlay .loading-text { font: 600 14px system-ui, Segoe UI, Arial; color:#1f3d6b; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .flow-row { display:flex; gap:10px; align-items:stretch; justify-content:space-between; }
    .flow-box { flex:1 1 0; display:flex; flex-direction:column; gap:6px; padding:10px; border-radius:10px; background:rgba(240,245,252,0.85); border:1px solid rgba(60,90,140,.12); text-align:center; }
    .flow-val { font-size:28px; font-weight:700; color:#1f3d6b; line-height:1; }
    .flow-title { font-size:12px; color:#2f5078; opacity:.8; }
    /* Fullscreen video mode */
    body.fs, html.fs { overflow:hidden; }
    body.fs #main-container { padding-top:0; }
    body.fs #videoWrapper { position: fixed !important; inset: 0 !important; margin:0 !important; border-radius:0 !important; width:100% !important; max-width:100% !important; }
    body.fs #overlayCanvas { border-radius:0 !important; }
    body.fs .top-toolbar { position: fixed !important; top:12px; left:12px; right:12px; z-index: 1002; background: rgba(255,255,255,0.56); }
    body.fs .right-col { display:none !important; }
    body.fs .left-col { min-width:0 !important; }
    body.fs .main-flex { justify-content:stretch !important; }
  </style>
</head>
<body style="overflow:auto;">
  <div id="main-container" class="flex flex-col" style="min-height:100vh; overflow:hidden;">
    <div class="top-toolbar minimal glass sticky-top" id="topToolbar">
      <div class="container toolbar-row-horizontal" style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
        <h2 class="m-0" style="flex:0 0 auto; white-space:nowrap;">PigWeight Monitor</h2>
        <div class="toolbar-group" id="streamGroup" style="flex:0 1 auto; min-width:150px; white-space:nowrap;">
          <div id="streamRadios" class="toggle-group compact"></div>
        </div>
        <label class="file-input-btn pill nowrap file-btn" id="fileInputLabel" title="Открыть видеофайл" style="flex:0 0 auto; padding:6px 10px; min-width:auto; text-align:center; max-width:280px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">
          <span id="fileInputName">Файл</span>
          <input id="videoFileInput" type="file" accept=".mp4,.mkv,.avi,.mov,.m4v,.webm,video/*">
        </label>
        <button id="videoPlayPauseBtn" class="pill nowrap" style="visibility:visible; flex:0 0 auto; padding:8px 14px; min-width:auto; height:40px; line-height:24px; font-weight:600;">Старт</button>
        <button id="fullscreenBtn" class="pill nowrap" aria-label="На весь экран" title="На весь экран"
                style="flex:0 0 auto; padding:6px; width:40px; height:40px; line-height:0; display:inline-flex; align-items:center; justify-content:center;">
          <!-- icon injected by JS -->
        </button>
        <div class="seek-wrap card card-md flex items-center gap-10 nowrap" style="flex:1 1 420px; min-width:220px; max-width:100%;">
          <input id="seekRange" type="range" min="0" max="0" step="0.1" value="0" style="flex:1 1 auto;">
          <div class="seek-times" style="flex:0 0 auto;"><span id="curTime">0.0</span> / <span id="durTime">0.0</span> c</div>
        </div>
        <span id="streamStatus" class="nowrap stream-status" aria-live="polite" style="flex:0 0 auto;"></span>
      </div>
    </div>
    <div class="main-flex" style="display:flex; justify-content:stretch;">
      <div class="container" style="display:flex; gap:0; width:100%; max-width:100%; align-items:stretch; padding:0; margin:0;">
        <div class="left-col" style="flex:1 1 auto; min-width:0; order:0;">
          <div id="videoWrapper" class="video-wrapper" style="position:fixed; inset:0; width:100%; height:100vh; margin:0; border-radius:0; background:#000;">
            <img id="videoStream" style="display:block; width:100%; height:100%; object-fit:contain;" />
            <canvas id="overlayCanvas"></canvas>
            <div id="loadingOverlay" aria-live="polite">
              <div class="box">
                <div class="spinner"></div>
                <div class="loading-text" id="loadingText">Загрузка…</div>
              </div>
            </div>
          </div>
        </div>
        <div class="right-col card glass rounded-xl" style="flex:0 0 420px; max-width:420px; order:1;">
          <div class="panel-body" style="padding:14px 16px; display:flex; flex-direction:column; gap:14px;">
            <div class="flow-row" id="flowRow">
              <div class="flow-box">
                <div class="flow-title">Слева (вход)</div>
                <div id="leftIn" class="flow-val">0</div>
              </div>
              <div class="flow-box">
                <div class="flow-title">Среднее</div>
                <div id="avgFlow" class="flow-val">0</div>
              </div>
              <div class="flow-box">
                <div class="flow-title">Справа (вход)</div>
                <div id="rightIn" class="flow-val">0</div>
              </div>
            </div>
            <div class="flow-row">
              <div class="flow-box" style="flex:1 1 100%;">
                <div class="flow-title">Акт взвешивания</div>
                <div style="display:flex; gap:12px; justify-content:space-between;">
                  <div><div class="flow-title">Всего свиней</div><div id="actSeen" class="flow-val">0</div></div>
                  <div><div class="flow-title">Пик одновременно</div><div id="actPeak" class="flow-val">0</div></div>
                  <div><div class="flow-title">Длительность, с</div><div id="actDur" class="flow-val">0</div></div>
                </div>
              </div>
            </div>
            <div class="stat-row" style="display:flex; gap:10px; align-items:center;">
              <label for="manualCount" class="stat-title" style="min-width:150px; color:#2f5078;">Количество</label>
              <input type="number" id="manualCount" min="0" style="flex:1 1 auto; min-width:0; font-size:32px; padding:12px 14px; font-weight:600;">
              <span class="unit-label" style="color:#2f5078;">шт.</span>
            </div>
            <div class="stat-row" style="display:flex; gap:10px; align-items:center;">
              <label for="manualTotalWeight" class="stat-title" style="min-width:150px; color:#2f5078;">Общий вес</label>
              <input type="number" id="manualTotalWeight" min="0" step="0.1" style="flex:1 1 auto; min-width:0; font-size:28px; padding:12px 14px;">
              <span class="unit-label" style="color:#2f5078;">кг</span>
            </div>
            <div class="stat-row" style="display:flex; gap:10px; align-items:center;">
              <label for="manualAvgWeight" class="stat-title" style="min-width:150px; color:#2f5078;">Средний вес</label>
              <input type="number" id="manualAvgWeight" min="0" step="0.01" style="flex:1 1 auto; min-width:0; font-size:28px; padding:12px 14px;">
              <span class="unit-label" style="color:#2f5078;">кг</span>
            </div>
            <button id="saveManualBtn" class="pill primary" style="height:48px; font-size:18px;">Сохранить</button>
            <canvas id="liveCountChart" height="160" style="width:100%; height:160px; flex:0 0 auto; border:1px solid rgba(60,90,140,.12); background:rgba(240,245,252,0.9);"></canvas>
          </div>
        </div>
      </div>
    </div>
    <table id="history">
      <thead>
        <tr><th>Дата</th><th>Камера</th><th>Кол-во</th><th>Общий вес</th><th>Средний вес</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
  <script>
    const videoStream = document.getElementById('videoStream');
    const overlayCanvas = document.getElementById('overlayCanvas');
    const videoPlayPauseBtn = document.getElementById('videoPlayPauseBtn');
    const fileInput = document.getElementById('videoFileInput');
    const fileInputLabel = document.getElementById('fileInputLabel');
    const fileInputName = document.getElementById('fileInputName');
    const streamStatus = document.getElementById('streamStatus');
    const streamRadios = document.getElementById('streamRadios');
    const seekRange = document.getElementById('seekRange');
    const curTime = document.getElementById('curTime');
    const durTime = document.getElementById('durTime');
    const liveCountChart = document.getElementById('liveCountChart');
    const historyTable = document.getElementById('history').querySelector('tbody');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const loadingText = document.getElementById('loadingText');

    let activeStreamId = null;
    let isVideoPlaying = false;
    let hasFirstFrame = false;
    let ws = null;
    let chart = null;
    const countHistory = [];
    const avgWindow = 10;
    const streamSources = {}; // id -> sourceUri (predefined + uploads)
    let seekTimer = null;
    let seekDebounce = null;
    let seekTargetTime = null; // целевое время после drag
    let seekLockUntil = 0;     // блок приёма t от сервера, пока не дойдём до цели/не истечёт
    let overlayEnabled = false;
    let idAliases = {}; // instanceId -> user-defined label
    let lastIds = null; // last ids from WS
    let lastMasks = null; // last masks from WS
    let overlayBlockUntil = 0;
    const leftInEl = document.getElementById('leftIn');
    const rightInEl = document.getElementById('rightIn');
    const avgFlowEl = document.getElementById('avgFlow');
    const actSeenEl = document.getElementById('actSeen');
    const actPeakEl = document.getElementById('actPeak');
    const actDurEl = document.getElementById('actDur');
    const fullscreenBtn = document.getElementById('fullscreenBtn');

    function aliasesKey(streamId) { return `aliases:${streamId}`; }
    function loadAliases(streamId) { try { return JSON.parse(localStorage.getItem(aliasesKey(streamId)) || '{}'); } catch { return {}; } }
    function saveAliases(streamId) { try { localStorage.setItem(aliasesKey(streamId), JSON.stringify(idAliases || {})); } catch {} }

    function updateVideoLayout() {
        const wrapper = document.getElementById('videoWrapper');
        if (!wrapper) return;
        wrapper.style.height = window.innerHeight + 'px';
        syncOverlaySize();
    }

    function showLoader(text = 'Загрузка…') {
        try { loadingText.textContent = text; loadingOverlay.style.display = 'flex'; } catch (e) {}
    }

    function hideLoader() {
        try { loadingOverlay.style.display = 'none'; } catch (e) {}
    }

    function setupFirstFrameWatch() {
        try {
            const onFirst = () => {
                if (!hasFirstFrame) {
                    hasFirstFrame = true;
                    try { videoStream.style.opacity = '1'; } catch (e) {}
                    hideLoader();
                }
            };
            // For MJPEG <img>, load may fire on frames; guard with flag
            videoStream.addEventListener('load', onFirst, { once: true });
        } catch (e) {}
    }

    async function getStreams() {
        // Fetch camera list only from backend (.env-driven)
        try {
            const resp = await fetch('/api/cameras');
            if (!resp.ok) return {};
            const data = await resp.json();
            return (data && typeof data === 'object') ? data : {};
        } catch (_) {
            return {};
        }
    }

    async function populateStreams() {
        const streams = await getStreams();
        streamRadios.innerHTML = '';
        const ids = Object.keys(streams);
        if (ids.length === 0) {
            // No cameras configured in .env
            streamRadios.innerHTML = '<span style="opacity:.6;">Нет камер</span>';
            return;
        }
        ids.forEach((id, idx) => {
            streamSources[id] = streams[id];
            const radio = document.createElement('input');
            radio.type = 'radio';
            radio.name = 'streamRadio';
            radio.value = id;
            radio.id = 'stream_' + id;
            if (idx === 0) {
                radio.checked = true;
                activeStreamId = id;
            }
            radio.style.display = 'none';
            radio.addEventListener('change', async () => {
                if (radio.checked) {
                    const prev = activeStreamId;
                    if (prev && prev !== id) {
                        await stopStream(prev);
                    }
                    activeStreamId = id;
                }
            });

            const label = document.createElement('label');
            label.htmlFor = radio.id;
            label.textContent = id;
            label.className = 'toggle-btn' + (idx === 0 ? ' selected' : '');

            streamRadios.appendChild(radio);
            streamRadios.appendChild(label);
        });
    }

    async function startStream(streamId, sourceUri) {
        streamSources[streamId] = sourceUri;
        hasFirstFrame = false;
        showLoader('Запуск…');
        try { videoStream.style.opacity = '0'; } catch (e) {}
        await fetch(`/api/stream/start?stream_id=${streamId}&source_uri=${encodeURIComponent(sourceUri)}`, { method: 'POST' });
        videoStream.src = `/api/stream/${streamId}/feed?ts=${Date.now()}`;
        setupFirstFrameWatch();
        isVideoPlaying = true;
        videoPlayPauseBtn.textContent = 'Стоп';
        streamStatus.textContent = 'Live';
        // enable overlay interactions while playing
        overlayEnabled = true;
        try {
            overlayCanvas.style.pointerEvents = 'auto';
            overlayCanvas.style.cursor = 'crosshair';
            overlayCanvas.style.opacity = '1';
        } catch (e) {}
        connectWebSocket(streamId);
        initChart();
        idAliases = loadAliases(streamId);
        
        // Configure seek UI (robust): drive state from /info on every poll
        if (seekTimer) { clearInterval(seekTimer); seekTimer = null; }
        let seekStepSet = false;
        const poll = async () => {
            try {
                const resp = await fetch(`/api/stream/${streamId}/info`);
                if (!resp.ok) return; // don't flip UI on transient errors
                const info = await resp.json();
                if (info && info.type === 'file') {
                    const dur = Number(info.duration || 0);
                    const t = Number(info.current_time || 0);
                    if (!Number.isNaN(dur)) { seekRange.max = dur; durTime.textContent = dur.toFixed(1); }
                    if (!Number.isNaN(t)) {
                        const now = performance.now();
                        if (seekTargetTime != null) {
                            const stepTol = Math.max(0.05, parseFloat(seekRange.step || '0.1') || 0.1) * 2;
                            const arrived = Math.abs(t - seekTargetTime) <= stepTol;
                            if (arrived || now > seekLockUntil) { seekTargetTime = null; seekLockUntil = 0; }
                            else { return; }
                        }
                        if (!isSeeking) {
                            seekRange.value = t;
                            curTime.textContent = t.toFixed(1);
                        }
                    }
                    const fps = Number(info.fps || 0);
                    if (!seekStepSet && fps > 0) {
                        seekRange.step = (1/Math.min(60, Math.max(1, fps))).toFixed(2);
                        seekStepSet = true;
                    }
                }
            } catch (e) {}
        };
        await poll();
        seekTimer = setInterval(poll, 500);
    }

    async function stopStream(id = activeStreamId) {
        if (id) {
            await fetch(`/api/stream/${id}/stop`);
        }
        hideLoader();
        if (ws) {
            ws.close();
            ws = null;
        }
        // Destroy chart to free the canvas before reuse
        if (typeof destroyChart === 'function') { destroyChart(); }
        if (activeStreamId) { try { saveAliases(activeStreamId); } catch (e) {} try { if (typeof saveColors==='function') saveColors(activeStreamId); } catch(e){} }
        if (seekTimer) { clearInterval(seekTimer); seekTimer = null; }
        // disable overlay so it doesn't intercept interactions
        overlayEnabled = false;
        if (overlayRaf) { cancelAnimationFrame(overlayRaf); overlayRaf = 0; }
        overlayPending = null;
        try {
            const ctx = overlayCanvas.getContext('2d');
            ctx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
            overlayCanvas.style.pointerEvents = 'none';
            overlayCanvas.style.cursor = 'default';
            overlayCanvas.style.opacity = '0';
        } catch (e) {}
        // Сброс счётчиков потоков
        try { leftInEl.textContent = '0'; rightInEl.textContent = '0'; avgFlowEl.textContent = '0'; } catch (e) {}
        setPlaceholder();
        isVideoPlaying = false;
        videoPlayPauseBtn.textContent = 'Старт';
        streamStatus.textContent = 'Остановлено';
        // Не меняем activeStreamId, чтобы повторный Старт запускал тот же источник
    }

    function connectWebSocket(streamId) {
        if (ws) {
            ws.close();
        }
        const proto = (location.protocol === 'https:') ? 'wss' : 'ws';
        ws = new WebSocket(`${proto}://${location.host}/ws/count?id=${streamId}`);
        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.type === 'count_update') {
                document.getElementById('manualCount').value = data.count;
                // Recalculate average weight if total is set
                if (typeof recalcAvgWeight === 'function') {
                    recalcAvgWeight();
                }
                if (data.debug && data.debug.masks) {
                    lastMasks = data.debug.masks;
                    lastIds = data.debug.ids || null;
                    try {
                        window.__lastCrossings = Array.isArray(data.debug.crossings) ? data.debug.crossings : [];
                        // анимированные всплывающие +1/-1
                        const now = performance.now();
                        window.__popups = window.__popups || [];
                        const prevTs = window.__lastPopupTs || 0; // ms
                        const cr = window.__lastCrossings;
                        let maxTs = prevTs;
                        cr.forEach(c => {
                            const tsMs = Number(c.ts || 0) * 1000;
                            if (tsMs > prevTs) {
                                const side = String(c.side || 'left');
                                const mode = String(c.mode || 'enter');
                                const isPositive = (side === 'left' && mode === 'enter') || (side === 'right' && mode === 'exit');
                                const text = isPositive ? '+1' : '-1';
                                const color = isPositive ? '#51cf66' : '#ff6b6b';
                                window.__popups.push({ x: Number(c.x)||0.5, y: Number(c.y)||0.5, text, color, t0: now, dur: 900, rise: 28 });
                            }
                            if (tsMs > maxTs) maxTs = tsMs;
                        });
                        window.__lastPopupTs = maxTs;
                    } catch (e) {}
                    try { if (Array.isArray(data.debug.labels)) window.__lastLabels = data.debug.labels; } catch (e) {}
                    scheduleOverlay(lastMasks, lastIds);
                    try { if (Array.isArray(lastMasks) && lastMasks.length) streamStatus.textContent = 'Live + overlay'; } catch (e) {}
                }
                if (data.debug && data.debug.flow) {
                    const f = data.debug.flow;
                    const leftInCount = Number(f.left_in ?? 0);
                    const rightInCount = Number(f.right_in ?? 0);
                    const av = Math.round((leftInCount + rightInCount) / 2);
                    try {
                        leftInEl.textContent = String(leftInCount);
                        rightInEl.textContent = String(rightInCount);
                        avgFlowEl.textContent = String(av);
                    } catch (e) {}
                    // Отобразить имя модели (если пришло) и размер входа
                    let modelInfo = '';
                    try {
                        const m = data.debug && data.debug.model ? data.debug.model : null;
                        const imgsz = data.debug && data.debug.imgsz ? `, ${data.debug.imgsz}` : '';
                        if (m && m.name) {
                            const dev = m.device ? `, ${m.device}${m.half?'/fp16':''}` : '';
                            modelInfo = ` | GPU: ${dev || 'cpu'} | Модель: ${m.name}${imgsz}`;
                        }
                    } catch (_) {}
                    streamStatus.textContent = `Live | Слева (вход): ${leftInCount} | Справа (вход): ${rightInCount}${modelInfo}`;
                }
                if (data.debug && data.debug.act) {
                    const a = data.debug.act;
                    try {
                        actSeenEl.textContent = String(Number(a.seen_total||0));
                        actPeakEl.textContent = String(Number(a.peak_concurrent||0));
                        actDurEl.textContent = String((Number(a.duration_sec||0)).toFixed(1));
                    } catch (e) {}
                }
                if (data.debug && data.debug.lines) {
                    try {
                        // Не перетирать локальное перетаскивание
                        if (!window.__isDraggingLines) {
                            window.__lines = data.debug.lines;
                        }
                    } catch (e) {}
                }
                // Update chart with low overhead
                if (chart) {
                    const now = performance.now();
                    if (!window.__lastChartTs || now - window.__lastChartTs > 400) {
                        window.__lastChartTs = now;
                        const tsLabel = new Date().toLocaleTimeString();
                        countHistory.push(data.count);
                        if (countHistory.length > 60) countHistory.shift();
                        const start = Math.max(0, countHistory.length - avgWindow);
                        const slice = countHistory.slice(start);
                        const avg = slice.reduce((a, b) => a + b, 0) / slice.length;

                        chart.data.labels.push(tsLabel);
                        chart.data.datasets[0].data.push(data.count);
                        chart.data.datasets[1].data.push(Number(avg.toFixed(2)));
                        const maxPoints = 60;
                        if (chart.data.labels.length > maxPoints) {
                            chart.data.labels.shift();
                            chart.data.datasets.forEach(ds => ds.data.shift());
                        }
                        chart.update('none');
                    }
                }
            }
        };
    }

    function setPlaceholder() {
        // SVG-заглушка в стиле liquid glass
        const svg = `<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1280 720' preserveAspectRatio='xMidYMid meet'>
  <defs>
    <linearGradient id='bgGrad' x1='0' y1='0' x2='0' y2='1'>
      <stop offset='0%' stop-color='#eef6ff'/>
      <stop offset='48%' stop-color='#e7eef9'/>
      <stop offset='100%' stop-color='#d9e6fb'/>
    </linearGradient>
    <radialGradient id='glow1' cx='80%' cy='-10%' r='80%'>
      <stop offset='0%' stop-color='rgba(124,199,255,0.35)'/>
      <stop offset='70%' stop-color='rgba(124,199,255,0.00)'/>
    </radialGradient>
    <radialGradient id='glow2' cx='10%' cy='10%' r='70%'>
      <stop offset='0%' stop-color='rgba(139,182,230,0.25)'/>
      <stop offset='70%' stop-color='rgba(139,182,230,0.00)'/>
    </radialGradient>
    <filter id='blur' x='-50%' y='-50%' width='200%' height='200%'>
      <feGaussianBlur stdDeviation='30'/>
    </filter>
    <linearGradient id='glassFill' x1='0' y1='0' x2='0' y2='1'>
      <stop offset='0%' stop-color='rgba(255,255,255,0.70)'/>
      <stop offset='100%' stop-color='rgba(255,255,255,0.35)'/>

  </g>

        const encoded = 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
        videoStream.src = encoded;
    }

    function syncOverlaySize() {
        const wrapper = document.getElementById('videoWrapper');
        const w = wrapper ? wrapper.clientWidth : videoStream.clientWidth;
        const h = wrapper ? wrapper.clientHeight : videoStream.clientHeight;
        if (!w || !h) return;
        const dpr = Math.max(1, Math.floor(window.devicePixelRatio || 1));
        const bw = Math.floor(w * dpr);
        const bh = Math.floor(h * dpr);
        if (overlayCanvas.width !== bw || overlayCanvas.height !== bh) {
            overlayCanvas.width = bw;
            overlayCanvas.height = bh;
            overlayCanvas.style.width = w + 'px';
            overlayCanvas.style.height = h + 'px';
        }
    }

    function getRenderedImageRect() {
        // Compute the actual displayed image rectangle inside the canvas,
        // accounting for object-fit: contain letterboxing.
        const wrapper = document.getElementById('videoWrapper');
        const cw = wrapper ? wrapper.clientWidth : overlayCanvas.width;
        const ch = wrapper ? wrapper.clientHeight : overlayCanvas.height;
        const iw = videoStream.naturalWidth || cw;
        const ih = videoStream.naturalHeight || ch;
        if (!iw || !ih) return { x: 0, y: 0, w: cw, h: ch };
        const scale = Math.min(cw / iw, ch / ih);
        const w = Math.round(iw * scale);
        const h = Math.round(ih * scale);
        const x = Math.floor((cw - w) / 2);
        const y = Math.floor((ch - h) / 2);
        return { x, y, w, h };
    }

    // Генерация пастельного цвета заливки по ID инстанса.
    // Идея: фиксированный "разброс" оттенка (Hue) по модулю 360,
    // а насыщенность/яркость держим высокими (70%/72%) и добавляем прозрачность 0.35,
    // поэтому итог — мягкие, но заметные пастельные цвета.
    // Множитель 57 даёт равномерное распределение оттенков для соседних ID
    // и снижает шанс близких цветов у подряд идущих объектов.
    function colorForInstance(instId) {
        const hue = (Number(instId) * 57) % 360; // псевдослучайное разнесение оттенков
        return `hsla(${hue}, 70%, 72%, 0.35)`;
    }

    // Цвет шрифта, если нужен цветной текст: тот же оттенок, но темнее,
    // чтобы читался поверх светлой пастельной маски. Сейчас цифры белые,
    // но функция оставлена для гибкости/экспериментов.
    function labelColorForInstance(instId) {
        const hue = (Number(instId) * 57) % 360;
        return `hsl(${hue}, 65%, 32%)`;
    }

    function drawOverlay(masks, ids = null) {
        syncOverlaySize();
        const ctx = overlayCanvas.getContext('2d');
        const dpr = Math.max(1, Math.floor(window.devicePixelRatio || 1));
        // Обеспечить единый масштаб в device pixels для чёткости
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const cw = overlayCanvas.width;
        const ch = overlayCanvas.height;
        ctx.clearRect(0, 0, cw, ch);

        const rect = getRenderedImageRect();

        // Выделенные линии отсечки по третям ширины
        try {
            ctx.save();
            const leftX = (window.__lines && typeof window.__lines.left_x === 'number') ? window.__lines.left_x : 0.25;
            const rightX = (window.__lines && typeof window.__lines.right_x === 'number') ? window.__lines.right_x : 0.75;
            const x1 = rect.x + rect.w * leftX;
            const x2 = rect.x + rect.w * rightX;
            // полупрозрачные направляющие полосы
            ctx.fillStyle = 'rgba(44,123,229,0.12)';
            ctx.fillRect(x1 - 2, rect.y, 4, rect.h);
            ctx.fillStyle = 'rgba(81,207,102,0.12)';
            ctx.fillRect(x2 - 2, rect.y, 4, rect.h);
            // основные яркие линии
            ctx.setLineDash([]);
            ctx.lineWidth = 2;
            ctx.strokeStyle = 'rgba(44,123,229,0.9)';
            ctx.beginPath();
            ctx.moveTo(x1, rect.y);
            ctx.lineTo(x1, rect.y + rect.h);
            ctx.stroke();
            ctx.strokeStyle = 'rgba(81,207,102,0.9)';
            ctx.beginPath();
            ctx.moveTo(x2, rect.y);
            ctx.lineTo(x2, rect.y + rect.h);
            ctx.stroke();
            // маленькие маркеры вверху
            ctx.fillStyle = 'rgba(44,123,229,0.95)';
            ctx.beginPath();
            ctx.arc(x1, rect.y + 10, 3.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'rgba(81,207,102,0.95)';
            ctx.beginPath();
            ctx.arc(x2, rect.y + 10, 3.5, 0, Math.PI * 2);
            ctx.fill();
            // Перетаскивание линий отсечки мышью/тапом
            try {
                if (!window.__linesDragInit) {
                    window.__linesDragInit = true;
                    const onPos = (e) => {
                        const r = overlayCanvas.getBoundingClientRect();
                        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                        const x = clientX - r.left;
                        return Math.max(0, Math.min(1, (x - rect.x) / rect.w));
                    };
                    let dragging = null; // 'left' | 'right'
                    const onDown = (e) => {
                        if (!overlayEnabled) return;
                        const nx = onPos(e);
                        const lx = (window.__lines && typeof window.__lines.left_x==='number') ? window.__lines.left_x : 0.25;
                        const rx = (window.__lines && typeof window.__lines.right_x==='number') ? window.__lines.right_x : 0.75;
                        const distL = Math.abs(nx - lx);
                        const distR = Math.abs(nx - rx);
                        if (distL < 0.02 || distR < 0.02) {
                            dragging = (distL < distR) ? 'left' : 'right';
                            window.__isDraggingLines = true;
                            e.preventDefault();
                        }
                    };
                    const onMove = (e) => {
                        const nx = onPos(e);
                        let lx = (window.__lines && typeof window.__lines.left_x==='number') ? window.__lines.left_x : 0.25;
                        let rx = (window.__lines && typeof window.__lines.right_x==='number') ? window.__lines.right_x : 0.75;
                        const nearLine = (Math.abs(nx - lx) < 0.02) || (Math.abs(nx - rx) < 0.02);
                        if (!dragging) {
                            // Подсказка курсора при наведении
                            overlayCanvas.style.cursor = nearLine ? 'ew-resize' : 'crosshair';
                            return;
                        }
                        // Перетаскивание
                        if (dragging === 'left') lx = nx; else rx = nx;
                        if (lx > rx) { const t = lx; lx = rx; rx = t; }
                        const minGap = 0.05;
                        if ((rx - lx) < minGap) {
                            const mid = (lx + rx) / 2;
                            lx = Math.max(0, mid - minGap/2);
                            rx = Math.min(1, mid + minGap/2);
                        }
                        window.__lines = { left_x: lx, right_x: rx };
                        overlayCanvas.style.cursor = 'ew-resize';
                        scheduleOverlay(lastMasks, lastIds);
                        e.preventDefault();
                    };
                    const onUp = async () => {
                        if (!dragging) return;
                        dragging = null;
                        try {
                            const { left_x, right_x } = window.__lines || {};
                            await fetch('/api/lines', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ left_x, right_x }) });
                        } catch(_) {}
                        overlayCanvas.style.cursor = 'crosshair';
                        window.__isDraggingLines = false;
                    };
                    overlayCanvas.addEventListener('mousedown', onDown);
                    overlayCanvas.addEventListener('mousemove', onMove);
                    overlayCanvas.addEventListener('mouseup', onUp);
                    overlayCanvas.addEventListener('mouseleave', () => { dragging = null; overlayCanvas.style.cursor = 'crosshair'; });
                    overlayCanvas.addEventListener('touchstart', onDown, {passive:false});
                    overlayCanvas.addEventListener('touchmove', onMove, {passive:false});
                    overlayCanvas.addEventListener('touchend', onUp);
                }
            } catch(_) {}
            ctx.restore();
        } catch (e) {}

        // Отрисовать кратковременные маркеры пересечений (если пришли)
        try {
            const cr = window.__lastCrossings || [];
            if (Array.isArray(cr) && cr.length) {
                ctx.save();
                cr.forEach(c => {
                    const cx = rect.x + (Number(c.x) || 0) * rect.w;
                    const cy = rect.y + (Number(c.y) || 0.5) * rect.h;
                    ctx.beginPath();
                    ctx.fillStyle = c.side === 'left' ? 'rgba(44,123,229,0.9)' : 'rgba(80,200,120,0.9)';
                    ctx.arc(cx, cy, 5, 0, Math.PI * 2);
                    ctx.fill();
                });
                ctx.restore();
            }
        } catch (e) {}

        // Всплывающие кругляши "+1/-1" над точкой пересечения
        try {
            if (Array.isArray(window.__popups) && window.__popups.length) {
                const now = performance.now();
                ctx.save();
                const keep = [];
                window.__popups.forEach(p => {
                    const k = Math.min(1, Math.max(0, (now - p.t0) / (p.dur || 900)));
                    const alpha = 1 - k;                 // плавное исчезание
                    const ease = k * (2 - k);             // ease-out для подъёма
                    const px = rect.x + (Number(p.x) || 0.5) * rect.w;
                    const py = rect.y + (Number(p.y) || 0.5) * rect.h - ease * (p.rise || 28);
                    const r = 13;                         // радиус пузыря
                    // фон пузыря
                    ctx.globalAlpha = Math.max(0, alpha);
                    ctx.beginPath();
                    ctx.fillStyle = (p.color || '#2c7be5').replace('0.9', '1');
                    ctx.arc(px, py, r, 0, Math.PI * 2);
                    ctx.fill();
                    // тонкая окантовка
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
                    ctx.stroke();
                    // текст
                    ctx.font = '700 14px system-ui, Segoe UI, Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillStyle = '#fff';
                    ctx.fillText(String(p.text || '+1'), px, py + 0.5);
                    if (k < 1) keep.push(p);
                });
                ctx.restore();
                window.__popups = keep;
                // пока есть активные попапы — продолжаем анимацию
                if (keep.length) {
                    try { scheduleOverlay(lastMasks, lastIds); } catch (_) {}
                }
            }
        } catch (e) {}

        if (!masks || !masks.length) return;

        // Soft pastel segmentation overlays, optional instance ids (from backend)
        masks.forEach((poly, idx) => {
            if (!Array.isArray(poly) || poly.length < 3) return;
            const labelArr = (window.__lastLabels && Array.isArray(window.__lastLabels)) ? window.__lastLabels : null;
            const instId = labelArr ? (labelArr[idx] || (idx + 1)) : ((ids && ids[idx]) ? ids[idx] : (idx + 1));
            const fill = colorForInstance(instId);
            ctx.beginPath();
            // Decimate polygon points adaptively to reduce path complexity
            const plen = poly.length;
            const step = Math.max(1, Math.floor(plen / 200));
            for (let i = 0; i < plen; i += step) {
                const nx = poly[i][0], ny = poly[i][1];
                const x = rect.x + nx * rect.w;
                const y = rect.y + ny * rect.h;
                if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.closePath();
            // Fill without expensive filters (avoid canvas blur to prevent jank)
            ctx.save();
            // мягкая, но более заметная заливка
            ctx.fillStyle = fill;
            ctx.globalAlpha = 0.60;
            ctx.fill();
            // лёгкий контур для читаемости
            ctx.globalAlpha = 0.50;
            ctx.lineWidth = 1.0;
            ctx.strokeStyle = 'rgba(30,50,80,0.20)';
            ctx.stroke();
            ctx.restore();

            // Number centered inside the object, colored like the mask
            // Compute simple centroid of polygon points (average)
            let sx = 0, sy = 0, pc = 0;
            poly.forEach(([nx, ny]) => { sx += nx; sy += ny; pc++; });
            if (pc > 0) {
                const cx = rect.x + (sx / pc) * rect.w;
                const cy = rect.y + (sy / pc) * rect.h;
                const label = String(idAliases[instId] ?? instId);
                ctx.save();
                ctx.font = '700 14px system-ui, Segoe UI, Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                // Outline for readability
                ctx.lineWidth = 3.5;
                ctx.strokeStyle = 'rgba(0,0,0,0.65)';
                ctx.strokeText(label, cx, cy);
                // Белая цифра поверх пастельной маски
                ctx.fillStyle = '#ffffff';
                ctx.fillText(label, cx, cy);
                ctx.restore();
            }
        });
    }

    // Schedule overlay draws on rAF (kept on main thread for stability)
    let overlayPending = null;
    let overlayRaf = 0;
    function scheduleOverlay(masks, ids) {
        if (performance.now() < overlayBlockUntil) return;
        overlayPending = { masks, ids };
        if (!overlayRaf) {
            overlayRaf = requestAnimationFrame(() => {
                const job = overlayPending; overlayPending = null; overlayRaf = 0;
                if (job) drawOverlay(job.masks, job.ids);
            });
        }
    }

    function pointInPoly(px, py, poly, rect) {
        let inside = false;
        for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
            const xi = rect.x + poly[i][0] * rect.w;
            const yi = rect.y + poly[i][1] * rect.h;
            const xj = rect.x + poly[j][0] * rect.w;
            const yj = rect.y + poly[j][1] * rect.h;
            const intersect = ((yi > py) !== (yj > py)) && (px < (xj - xi) * (py - yi) / ((yj - yi) || 1e-6) + xi);
            if (intersect) inside = !inside;
        }
        return inside;
    }

    overlayCanvas.addEventListener('click', (e) => {
        if (!lastMasks || !lastMasks.length) return;
        const rectDom = overlayCanvas.getBoundingClientRect();
        const px = e.clientX - rectDom.left;
        const py = e.clientY - rectDom.top;
        const imgRect = getRenderedImageRect();
        // check topmost polygon first: iterate reversed
        let foundIdx = -1;
        for (let i = lastMasks.length - 1; i >= 0; i--) {
            if (pointInPoly(px, py, lastMasks[i], imgRect)) { foundIdx = i; break; }
        }
        if (foundIdx < 0) return;
        const instId = (lastIds && lastIds[foundIdx]) ? lastIds[foundIdx] : (foundIdx + 1);
        const current = idAliases[instId] ?? instId;
        const val = prompt('Номер свиньи для ID ' + instId + ':', String(current));
        if (val === null) return;
        const trimmed = String(val).trim();
        if (trimmed === '') { delete idAliases[instId]; } else { idAliases[instId] = trimmed; }
        if (activeStreamId) saveAliases(activeStreamId);
        drawOverlay(lastMasks, lastIds);
    });

    // Keyboard seek (Left/Right arrows). Shift=±1s, Ctrl=±5s, иначе ±step
    function setSeekUIVal(t) {
        let max = Number(seekRange.max || 0);
        let clamped = Math.max(0, Math.min(max, Number(t) || 0));
        seekRange.value = clamped;
        try { curTime.textContent = clamped.toFixed(1); } catch (_) {}
        return clamped;
    }
    async function requestSeekTo(t) {
        const id = activeStreamId;
        const src = streamSources[id] || '';
        // блокируем приём времени до прихода к цели
        seekTargetTime = Number(t) || 0;
        seekLockUntil = performance.now() + 1200;
        overlayBlockUntil = performance.now() + 180;
        if (!/^rtsp:\/\//i.test(src)) {
            try { await fetch(`/api/stream/${id}/seek?t=${encodeURIComponent(seekTargetTime)}`); } catch (_) {}
        }
    }
    document.addEventListener('keydown', (e) => {
        const ae = document.activeElement;
        const tag = (ae && ae.tagName || '').toLowerCase();
        if (tag === 'input' || tag === 'textarea' || tag === 'select' || (ae && ae.isContentEditable)) return;
        if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
            const id = activeStreamId;
            const src = streamSources[id] || '';
            // Только для файловых источников
            if (/^rtsp:\/\//i.test(src)) return;
            e.preventDefault();
            const base = Math.max(0.05, parseFloat(seekRange.step || '0.1') || 0.1);
            const step = e.ctrlKey ? 5.0 : (e.shiftKey ? 1.0 : base);
            const cur = Number(seekRange.value || 0);
            const dir = (e.key === 'ArrowRight') ? 1 : -1;
            const target = setSeekUIVal(cur + dir * step);
            requestSeekTo(target);
        }
    });

            chart = null;

    }

          : '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M7 7h4V5H5v6h2V7ZM13 7h4v4h2V5h-6v2ZM7 13H5v6h6v-2H7v-4ZM17 17h-4v2h6v-6h-2v4Z" fill="#1f3d6b"/></svg>';

    function shortenFileName(name, max = 28) {
        if (!name) return '';
        if (name.length <= max) return name;
        const extIdx = name.lastIndexOf('.');
        const ext = extIdx > 0 ? name.slice(extIdx) : '';
        const keep = Math.max(4, max - ext.length - 3);
        const head = name.slice(0, Math.ceil(keep/2));
        const tail = name.slice(ext ? -Math.floor(keep/2) - ext.length : -Math.floor(keep/2));
        return `${head}…${tail}${ext}`;
    }

    fileInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) {
            fileInputName.textContent = 'Файл';
            fileInputLabel.title = 'Открыть видеофайл';
            return;
        }

        // Reflect selected filename on the button
        fileInputName.textContent = shortenFileName(file.name);
        fileInputLabel.title = file.name;

        const formData = new FormData();
        formData.append('file', file);

        const uploadResponse = await fetch('/api/upload', {
            method: 'POST',
            body: formData
        });

        const uploadData = await uploadResponse.json();

        if (uploadResponse.ok) {
            const streamId = 'file_' + Date.now();
            const sourceUri = uploadData.file_path;
            
            await stopStream();
            activeStreamId = streamId;
            streamSources[streamId] = sourceUri;
            // Seed duration from upload meta if available
            if (uploadData.duration) {
                const dur = Number(uploadData.duration || 0);
                if (!Number.isNaN(dur) && dur > 0) {
                    seekRange.max = dur;
                    durTime.textContent = dur.toFixed(1);
                }
                if (uploadData.fps) {
                    const fps = Number(uploadData.fps || 0);
                    if (!Number.isNaN(fps) && fps > 0) {
                        seekRange.step = (1/Math.min(60, Math.max(1, fps))).toFixed(2);
                    }
                }
            }
            await startStream(streamId, sourceUri);
            // Confirm once more from /info
            try {
                const response = await fetch(`/api/stream/${streamId}/info`);
                if (response.ok) {
                    const info = await response.json();
                    const dur = Number(info.duration || 0);
                    if (!Number.isNaN(dur) && dur > 0) {
                        seekRange.max = dur;
                        durTime.textContent = dur.toFixed(1);
                    }
                }
            } catch (_) {}
            // keep slider always enabled; just update values
        } else {
            streamStatus.textContent = `Error uploading file: ${uploadData.error}`;
        }
    });

    // Seek handlers (single-request logic)
    let isSeeking = false;
    seekRange.addEventListener('input', (e) => {
        e.stopPropagation();
        const t = Number(e.target.value || 0);
        curTime.textContent = t.toFixed(1);
        const id = activeStreamId;
        const src = streamSources[id] || '';
        if (/^rtsp:\/\//i.test(src)) return;
        // Во время drag отправляем только на pointerup — не дёргаем бекенд из input
        if (isSeeking) {
            if (seekDebounce) { clearTimeout(seekDebounce); seekDebounce = null; }
            return;
        }
        // Клавиатурная/программная смена — мягкий дебаунс
        if (seekDebounce) clearTimeout(seekDebounce);
        seekDebounce = setTimeout(async () => {
            try {
                overlayBlockUntil = performance.now() + 120;
                await fetch(`/api/stream/${id}/seek?t=${encodeURIComponent(t)}`);
            } catch (_) {}
        }, 150);
    });
    // Manage pointer drag to avoid duplicate change/pointerup seeks
    seekRange.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        isSeeking = true;
        if (seekDebounce) { clearTimeout(seekDebounce); seekDebounce = null; }
    });
    seekRange.addEventListener('pointerup', async (e) => {
        e.stopPropagation();
        const id = activeStreamId;
        const src = streamSources[id] || '';
        const t = Number(seekRange.value || 0);
        const finishDrag = () => { isSeeking = false; };
        // блокируем приём серверного t, пока не дойдём до цели
        seekTargetTime = t;
        seekLockUntil = performance.now() + 1200;
        if (!/^rtsp:\/\//i.test(src)) {
            try {
                if (seekDebounce) { clearTimeout(seekDebounce); seekDebounce = null; }
                overlayBlockUntil = performance.now() + 180;
                await fetch(`/api/stream/${id}/seek?t=${encodeURIComponent(t)}`);
            } catch (_) {
            } finally {
                finishDrag();
            }
        } else {
            // Для RTSP ничего не дергаем на бек — просто выходим из режима
            finishDrag();
        }
    });

    document.addEventListener('DOMContentLoaded', async () => {
        populateStreams();
        updateVideoLayout();
        window.addEventListener('resize', () => { syncOverlaySize(); updateVideoLayout(); });
        setPlaceholder();
        // Worker disabled for now to avoid seek freezes
        // Load and display history from localStorage
        const history = JSON.parse(localStorage.getItem('history') || '[]');
        history.forEach(item => {
            const row = historyTable.insertRow();
            row.insertCell().textContent = item.date;
            row.insertCell().textContent = item.camera;
            row.insertCell().textContent = item.count;
            row.insertCell().textContent = item.total_weight;
            row.insertCell().textContent = item.avg_weight;
        });

        // Save button logic
        document.getElementById('saveManualBtn').addEventListener('click', () => {
            const history = JSON.parse(localStorage.getItem('history') || '[]');
            const newEntry = {
                date: new Date().toLocaleString(),
                camera: activeStreamId,
                count: document.getElementById('manualCount').value,
                total_weight: document.getElementById('manualTotalWeight').value,
                avg_weight: document.getElementById('manualAvgWeight').value
            };
            history.unshift(newEntry);
            localStorage.setItem('history', JSON.stringify(history.slice(0, 10)));
            updateHistory();
        });

        // Autostart the default stream
        const streams = await getStreams();
        const defaultStreamId = Object.keys(streams)[0];
        const defaultSourceUri = streams[defaultStreamId];
        if (defaultStreamId && defaultSourceUri) {
            await startStream(defaultStreamId, defaultSourceUri);
        }
    });

    function updateHistory() {
        historyTable.innerHTML = '';
        const history = JSON.parse(localStorage.getItem('history') || '[]');
        history.forEach(item => {
            const row = historyTable.insertRow();
            row.insertCell().textContent = item.date;
            row.insertCell().textContent = item.camera;
            row.insertCell().textContent = item.count;
            row.insertCell().textContent = item.total_weight;
            row.insertCell().textContent = item.avg_weight;
        });
    }

    function recalcAvgWeight() {
        const count = parseInt(document.getElementById('manualCount').value);
        const totalWeight = parseFloat(document.getElementById('manualTotalWeight').value);
        if (count > 0 && totalWeight > 0) {
            const avgWeight = totalWeight / count;
            document.getElementById('manualAvgWeight').value = avgWeight.toFixed(2);
        } else {
            document.getElementById('manualAvgWeight').value = '';
        }
    }

    document.getElementById('manualCount').addEventListener('input', recalcAvgWeight);
    document.getElementById('manualTotalWeight').addEventListener('input', recalcAvgWeight);

  </script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</body>
</html>
