<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PigWeight MVP</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <link rel="stylesheet" href="/static/css/theme.css">
  
  <!-- Модульная архитектура JavaScript -->
  <script type="module" src="/static/js/app.js"></script>
  
  <style>
    .top-toolbar { position: fixed !important; top: 0; left: 0; right: 0; z-index: 1000; background: rgba(255, 255, 255, 0.56); backdrop-filter: blur(12px); box-shadow: 0 2px 12px rgba(40,60,90,0.12); overflow: visible !important; height: auto !important; max-height: none !important; }
    .top-toolbar .container { overflow: visible !important; height: auto !important; max-height: none !important; flex-wrap: nowrap !important; align-items: center !important; justify-content: flex-start !important; gap: 8px; }
    .top-toolbar .pill, .top-toolbar .file-input-btn { height: 32px; line-height: 20px; }
    html, body { margin: 0; padding: 0; }
    #main-container { padding-top: 64px; }
    .video-wrapper { position: relative; }
    #overlayCanvas { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:auto; z-index: 10; background-color: transparent; cursor: crosshair; }
    #videoStream { display: block; width: 100%; height: auto; object-fit: contain; z-index: 1; opacity: 1 !important; }
    /* Align numeric inputs on the weights panel to the right */
    .panel-body input[type="number"] { text-align: right; }
    .stream-status { display:inline-block; min-width:64px; text-align:right; }
    /* Loading overlay */
    #loadingOverlay { position:absolute; inset:0; z-index: 20; display:none; align-items:center; justify-content:center; backdrop-filter: blur(2px); background: rgba(245,248,255,0.72); }
    #loadingOverlay .box { display:flex; flex-direction:column; align-items:center; gap:10px; padding:16px 18px; border-radius:12px; background: rgba(255,255,255,0.9); border:1px solid rgba(60,90,140,.12); box-shadow: 0 6px 24px rgba(40,60,90,.12); }
    #loadingOverlay .spinner { width:28px; height:28px; border:3px solid rgba(44,123,229,0.18); border-top-color:#2c7be5; border-radius:50%; animation: spin 0.9s linear infinite; }
    #loadingOverlay .loading-text { font: 600 14px system-ui, Segoe UI, Arial; color:#1f3d6b; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .flow-row { display:flex; gap:10px; align-items:stretch; justify-content:space-between; }
    .flow-box { flex:1 1 0; display:flex; flex-direction:column; gap:6px; padding:10px; border-radius:10px; background:rgba(240,245,252,0.85); border:1px solid rgba(60,90,140,.12); text-align:center; }
    .flow-val { font-size:28px; font-weight:700; color:#1f3d6b; line-height:1; }
    .flow-title { font-size:12px; color:#2f5078; opacity:.8; }
    /* Fullscreen video mode */
    body.fs, html.fs { overflow:hidden; }
    body.fs #main-container { padding-top:0; }
    body.fs #videoWrapper { position: fixed !important; inset: 0 !important; margin:0 !important; border-radius:0 !important; width:100% !important; max-width:100% !important; }
    body.fs #overlayCanvas { border-radius:0 !important; }
    body.fs .top-toolbar { position: fixed !important; top:12px; left:12px; right:12px; z-index: 1002; background: rgba(255,255,255,0.56); }
    body.fs .right-col { display:none !important; }
    body.fs .left-col { min-width:0 !important; }
    body.fs .main-flex { justify-content:stretch !important; }

    /* Compact right panel (recursive compacting to remove empty space) */
    :root{ 
      --sidebar-width: 380px; 
      --liquid-glass-bg: rgba(255, 255, 255, 0.65);
      --liquid-glass-border: rgba(255, 255, 255, 0.18);
      --liquid-glass-shadow: rgba(31, 38, 135, 0.15);
      --liquid-glass-blur: 10px;
      --liquid-glass-hover: rgba(255, 255, 255, 0.75);
      --liquid-glass-active: rgba(255, 255, 255, 0.85);
      --journal-glass: var(--liquid-glass-bg);
      --journal-border: var(--liquid-glass-border);
      --radius-md: 12px;
      --radius-sm: 8px;
      --text-primary: #1f3d6b;
      --text-secondary: #2f5078;
      --accent-color: #2c7be5;
    }
    
    /* Стили для вкладок в стиле liquid glass */
    .journal-tabs {
      display: flex;
      flex-wrap: nowrap; /* Prevent wrapping */
      gap: 8px;
      margin-bottom: 12px;
      overflow-x: auto; /* Allow horizontal scrolling */
      /* Hide scrollbar for a cleaner look */
      scrollbar-width: none; /* Firefox */
      -ms-overflow-style: none;  /* IE and Edge */
    }
    .journal-tabs::-webkit-scrollbar {
      display: none; /* Chrome, Safari, and Opera */
    }
    .journal-tab-btn {
      background: var(--liquid-glass-bg);
      backdrop-filter: blur(var(--liquid-glass-blur));
      border: 1px solid var(--liquid-glass-border);
      border-radius: var(--radius-md);
      padding: 10px 14px;
      font-size: 14px;
      color: var(--text-primary);
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .journal-tab-btn:not(.active):hover {
      background: var(--accent-color);
      color: #fff;
    }
    .journal-tab-btn.active {
      background: var(--liquid-glass-active);
      border-color: rgba(124, 199, 255, 0.35);
      box-shadow: 0 4px 12px rgba(31, 38, 135, 0.15);
      color: var(--text-primary);
    }
    .right-col{ padding:8px !important; }
    .right-col .journal-tabs{ margin:0 0 4px 0 !important; }
    .right-col .panel-content{ padding:6px !important; }
    .right-col .journal-container{ padding:4px 6px !important; }
    .right-col .journal-header{ padding:4px 6px !important; margin:0 0 4px 0 !important; }
    .right-col .journal-filters{ gap:4px !important; }
    .right-col .journal-stat-card{ 
      padding:6px 8px !important; 
      margin:4px 0 !important; 
      background: var(--liquid-glass-bg); 
      backdrop-filter: blur(var(--liquid-glass-blur)); 
      border: 1px solid var(--liquid-glass-border); 
      border-radius: var(--radius-sm); 
      box-shadow: 0 2px 8px var(--liquid-glass-shadow);
    }
    .journal-stat-value { font-size: 28px !important; font-weight: 700; color: var(--text-primary); line-height: 1; }
    .journal-stat-card.stat-minor .journal-stat-value { font-size: 22px !important; font-weight: 600; }
    .journal-stat-card.stat-minor .journal-stat-label { font-size: 11px; opacity: 0.8; }
    .right-col .card{ padding:6px !important; }
    .right-col .journal-comparison-result{ padding:6px 8px !important; }
    .right-col .journal-btn{ height:30px; line-height:28px; padding:0 10px; }
    .right-col input, .right-col select{ 
      height:32px; 
      background: var(--liquid-glass-bg);
      border: 1px solid var(--liquid-glass-border);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      padding: 0 8px;
    }

    /* Responsive Adjustments */
    @media (max-width: 1024px) {
      .top-toolbar .container {
        flex-wrap: wrap !important;
      }
      .seek-wrap {
        min-width: 320px !important;
      }
    }

    @media (max-width: 768px) {
      body, html {
        overflow: auto !important;
      }
      .main-flex {
        flex-direction: column;
        height: auto !important;
        padding-top: 150px !important; /* Adjust based on new toolbar height */
      }
      .left-col, .right-col {
        position: static !important;
        width: 100% !important;
        min-width: 100% !important;
        max-width: 100% !important;
        margin-bottom: 12px;
      }
      #videoWrapper {
        position: relative !important;
        height: 50vh !important; /* Or any other suitable height */
      }
      .right-col {
        top: auto; right: auto; bottom: auto;
        height: auto;
      }
    }
  </style>
</head>
<body style="overflow:hidden;">
  <div id="main-container" class="flex flex-col" style="min-height:100vh; overflow:hidden; height:100vh;">
    <div class="top-toolbar minimal sticky-top" id="topToolbar" style="padding:6px 12px; position:fixed; top:12px; left:12px; right:12px; z-index:1000; background: var(--liquid-glass-bg); backdrop-filter: blur(var(--liquid-glass-blur)); border: 1px solid var(--liquid-glass-border); box-shadow: 0 8px 32px var(--liquid-glass-shadow); border-radius: 16px;">
      <div class="container toolbar-row-horizontal" style="display:flex; gap:4px; align-items:center; flex-wrap:nowrap;">
        <h2 class="m-0" style="flex:0 0 auto; white-space:nowrap;">PigWeight v3.0</h2>

        <div class="toolbar-group" id="streamGroup" style="flex:0 1 auto; min-width:150px; white-space:nowrap;">
          <div id="streamRadios" class="toggle-group compact"></div>
        </div>
        <label class="file-input-btn nowrap file-btn" id="fileInputLabel" title="Открыть видеофайл" style="flex:0 0 auto; padding:4px 8px; min-width:auto; text-align:center; max-width:280px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; order:4; background: var(--liquid-glass-bg); backdrop-filter: blur(var(--liquid-glass-blur)); border: 1px solid var(--liquid-glass-border); border-radius: var(--radius-sm); color: var(--text-primary); transition: all 0.2s ease; cursor: pointer;">
          <span id="fileInputName">Файл</span>
          <input id="videoFileInput" type="file" accept=".mp4,.mkv,.avi,.mov,.m4v,.webm,video/*">
        </label>
        <button id="videoPlayPauseBtn" class="nowrap" style="visibility:visible; flex:0 0 auto; padding:4px 10px; min-width:auto; height:32px; line-height:24px; font-weight:600; order:5; background: var(--liquid-glass-bg); backdrop-filter: blur(var(--liquid-glass-blur)); border: 1px solid var(--liquid-glass-border); border-radius: var(--radius-sm); color: var(--text-primary); transition: all 0.2s ease; cursor: pointer;">Старт</button>
        <div style="display:flex; align-items:center; gap:2px; flex:0 0 auto; order:2; background: var(--liquid-glass-bg); backdrop-filter: blur(var(--liquid-glass-blur)); border: 1px solid var(--liquid-glass-border); border-radius: var(--radius-sm); padding: 0 6px;">
          <select id="transportSelect" style="height:32px; background: transparent; border: none; color: var(--text-primary); font-weight: 500;">
            <option value="mjpeg">MJPEG</option>
            <option value="webrtc" selected>WebRTC</option>
          </select>
        </div>
        <button id="fullscreenBtn" class="nowrap" aria-label="На весь экран" title="На весь экран"
                style="flex:0 0 auto; padding:6px; width:40px; height:40px; line-height:0; display:inline-flex; align-items:center; justify-content:center; order:3; background: var(--liquid-glass-bg); backdrop-filter: blur(var(--liquid-glass-blur)); border: 1px solid var(--liquid-glass-border); border-radius: var(--radius-sm); color: var(--text-primary); transition: all 0.2s ease; cursor: pointer;">
          <!-- icon injected by JS -->
        </button>
        <div class="seek-wrap flex items-center gap-6 nowrap" style="flex:1 1 100%; min-width:480px; max-width:100%; order:1; background: var(--liquid-glass-bg); backdrop-filter: blur(var(--liquid-glass-blur)); border: 1px solid var(--liquid-glass-border); box-shadow: 0 4px 16px var(--liquid-glass-shadow); border-radius: var(--radius-md); padding: 4px 8px; resize: horizontal; overflow: hidden;">
          <input id="seekRange" type="range" min="0" max="0" step="0.1" value="0" style="flex:1 1 auto;">
          <div class="seek-times" style="flex:0 0 auto;"><span id="curTime">0.0</span> / <span id="durTime">0.0</span> c</div>
        </div>
        <span id="streamStatus" class="nowrap stream-status" aria-live="polite" style="flex:0 0 auto; order:6; font-size:12px; color:var(--text-secondary); background: var(--liquid-glass-bg); backdrop-filter: blur(var(--liquid-glass-blur)); border: 1px solid var(--liquid-glass-border); border-radius: var(--radius-sm); padding: 4px 8px; margin-left:6px; white-space:nowrap;"></span>
      </div>
    </div>
    <div class="main-flex" style="display:flex; justify-content:stretch; padding-top:76px; height:calc(100vh - 76px); position:relative;">
      <div class="container" style="display:flex; gap:0; width:100%; max-width:100%; align-items:stretch; padding:0; margin:0;">
        <div class="left-col" style="flex:1 1 auto; min-width:0; order:0;">
          <div id="videoWrapper" class="video-wrapper" style="position:fixed; inset:0; width:100%; height:100vh; margin:0; border-radius:0; background:#000;">
            <img id="videoStream" style="display:block; width:100%; height:100%; object-fit:contain;" />
            <video id="webrtcVideo" autoplay playsinline muted style="display:none; width:100%; height:100%; object-fit:contain;"></video>
            <canvas id="overlayCanvas"></canvas>
            <div id="loadingOverlay" aria-live="polite">
              <div class="box">
                <div class="loading-text" id="loadingText">Готово к пуску</div>
              </div>
            </div>
          </div>
        </div>
        <div class="right-col rounded-xl" style="width:var(--sidebar-width, 380px); min-width:var(--sidebar-width, 380px); max-width:var(--sidebar-width, 380px); box-sizing:border-box; order:1; position:fixed; right:12px; top:68px; bottom:12px; overflow-y:auto; scrollbar-width: none; -ms-overflow-style: none; z-index: 1001; background: var(--liquid-glass-bg); backdrop-filter: blur(var(--liquid-glass-blur)); border: 1px solid var(--liquid-glass-border); box-shadow: 0 8px 32px var(--liquid-glass-shadow); border-radius: 16px;">
          <!-- Навигационные вкладки (liquid glass стиль) -->
          <div class="journal-tabs">
            <button class="journal-tab-btn active" onclick="switchPanel('live')">
              <span class="journal-tab-icon">📊</span>
              <span class="journal-tab-text">Live</span>
            </button>
            <button class="journal-tab-btn" onclick="switchPanel('weighing')">
              <span class="journal-tab-icon">⚖️</span>
              <span class="journal-tab-text">Взвешивания</span>
            </button>
            <button class="journal-tab-btn" onclick="switchPanel('logs')">
              <span class="journal-tab-icon">📋</span>
              <span class="journal-tab-text">Журналы</span>
            </button>
            <button class="journal-tab-btn" onclick="switchPanel('verification')">
              <span class="journal-tab-icon">🔍</span>
              <span class="journal-tab-text">Сверка</span>
            </button>
          </div>

          <!-- Панель Live (liquid glass стиль) -->
          <div id="livePanel" class="panel-content active" style="padding:0;">
            <div class="journal-container">
              <!-- Счетчики потока -->
              <div class="journal-stats" style="grid-template-columns: 1fr 1fr 1fr;">
                <div class="journal-stat-card">
                  <div class="journal-stat-value" id="leftIn" style="transition: color 0.3s ease;">0</div>
                  <div class="journal-stat-label">Слева (вход)</div>
                </div>
                <div class="journal-stat-card">
                  <div class="journal-stat-value" id="rightIn" style="transition: color 0.3s ease;">0</div>
                  <div class="journal-stat-label">Справа (выход)</div>
                </div>
                <div class="journal-stat-card stat-minor">
                  <div class="journal-stat-value" id="totalCrossings" style="transition: color 0.3s ease;">0</div>
                  <div class="journal-stat-label">Всего пересечений</div>
                </div>
              </div>

              <!-- Текущий акт взвешивания -->
              <div class="journal-stats" style="grid-template-columns: 1fr 1fr;">
                <div class="journal-stat-card">
                  <div class="journal-stat-value" id="actPeak">0</div>
                  <div class="journal-stat-label">Пик одновременно</div>
                </div>
                <div class="journal-stat-card">
                  <div class="journal-stat-value" id="actDur">0</div>
                  <div class="journal-stat-label">Длительность, с</div>
                </div>
              </div>

              <!-- Форма ввода данных -->
              <div class="journal-header">
                <div class="journal-title">💾 Новый акт взвешивания</div>
              </div>

              <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px;">
                <div>
                  <label style="display: block; font-size: 13px; color: var(--muted); margin-bottom: 3px;">Количество голов</label>
                  <input type="number" id="manualCount" min="0" class="journal-filter-input" style="font-size: 20px; font-weight: 600; text-align: center; width: 100%; box-sizing: border-box;" placeholder="0">
                </div>
                <div>
                  <label style="display: block; font-size: 13px; color: var(--muted); margin-bottom: 3px;">Общий вес (кг)</label>
                  <input type="number" id="manualTotalWeight" min="0" step="0.1" class="journal-filter-input" style="font-size: 20px; font-weight: 600; text-align: center; width: 100%; box-sizing: border-box;" placeholder="0.0">
                </div>
              </div>

              <button id="saveManualBtn" style="width: 100%; height: 48px; font-size: 16px; font-weight: 600; background: var(--liquid-glass-active); backdrop-filter: blur(var(--liquid-glass-blur)); border: 1px solid var(--liquid-glass-border); border-radius: var(--radius-md); color: var(--text-primary); box-shadow: 0 4px 16px var(--liquid-glass-shadow); cursor: pointer; transition: all 0.2s ease;">
                💾 Сохранить акт взвешивания
              </button>

              <!-- График -->
              <div style="margin-top: 10px; background: var(--liquid-glass-bg); border: 1px solid var(--liquid-glass-border); border-radius: var(--radius-md); padding: 8px; backdrop-filter: blur(var(--liquid-glass-blur)); box-shadow: 0 4px 16px var(--liquid-glass-shadow);">
                <canvas id="liveCountChart" height="160" style="width:100%; height:160px;"></canvas>
              </div>
            </div>
          </div>

          <!-- Остальные панели... (сокращено для краткости) -->
          <div id="weighingPanel" class="panel-content" style="padding:0; display:none;">
            <div class="journal-container">
              <div class="journal-header">
                <div class="journal-title">⚖️ Журналирование актов взвешивания</div>
              </div>
              <!-- Содержимое панели взвешивания -->
            </div>
          </div>

          <div id="logsPanel" class="panel-content" style="padding:0; display:none;">
            <div class="journal-container">
              <div class="journal-header">
                <div class="journal-title">📊 Журнал взвешиваний</div>
              </div>
              <!-- Содержимое панели журналов -->
            </div>
          </div>

          <div id="verificationPanel" class="panel-content" style="padding:0; display:none;">
            <div class="journal-container">
              <div class="journal-header">
                <div class="journal-title">📊 Сверка с Excel</div>
              </div>
              <!-- Содержимое панели сверки -->
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <script>
    /**
     * Минимальный код совместимости для работы с модульной архитектурой
     * Основная логика перенесена в модули в папке /static/js/
     */
    
    // Глобальные функции для обратной совместимости
    window.switchPanel = function(panelName) {
      if (window.pigWeightApp && window.pigWeightApp.ui) {
        return window.pigWeightApp.ui.switchPanel(panelName);
      }
      console.warn('PigWeight App не инициализирован');
    };
    
    window.recalcAvgWeight = function() {
      const totalInput = document.getElementById('weighingTotal');
      const weightInput = document.getElementById('weighingWeight');
      const avgInput = document.getElementById('weighingAvgWeight');
      
      if (totalInput && weightInput && avgInput) {
        const total = parseFloat(totalInput.value) || 0;
        const weight = parseFloat(weightInput.value) || 0;
        
        if (total > 0 && weight > 0) {
          avgInput.value = (weight / total).toFixed(2);
        } else {
          avgInput.value = '';
        }
      }
    };
    
    window.showNotification = function(message, type = 'info') {
      // Уведомления отключены - только в консоль
      console.log(`[${type.toUpperCase()}] ${message}`);
      return;
    };
    
    // Инициализация совместимости при загрузке DOM
    document.addEventListener('DOMContentLoaded', () => {
      console.log('🔧 Режим совместимости активирован');
      
      // Добавляем обработчики для форм
      const totalInput = document.getElementById('weighingTotal');
      const weightInput = document.getElementById('weighingWeight');
      
      if (totalInput) totalInput.addEventListener('input', window.recalcAvgWeight);
      if (weightInput) weightInput.addEventListener('input', window.recalcAvgWeight);
      
      // Устанавливаем текущую дату и время
      const now = new Date();
      const dateInput = document.getElementById('weighingDate');
      const timeInput = document.getElementById('weighingTime');
      
      if (dateInput) dateInput.value = now.toISOString().split('T')[0];
      if (timeInput) timeInput.value = now.toTimeString().slice(0, 5);
    });
  </script>
</body>
</html>
